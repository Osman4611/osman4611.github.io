<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Castle · Mehmet Tarman Ortaokulu</title>
<meta name="theme-color" content="#0b0833">
<meta name="description" content="Mehmet Tarman Ortaokulu İngilizce kelime savunma oyunu">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#0d0a2a;color:#fff;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden;touch-action:manipulation}
#game{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
#hud{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:1.2vh 2vw;background:#1b1650;border-bottom:4px solid #3a2f9e;font-weight:900;font-size:clamp(16px,2.8vw,36px)}
#hud .g{display:flex;gap:2vw;align-items:center}
#hud small{display:block;font-size:.45em;color:#9fa0ff;font-weight:700;line-height:1}
.ib{border:0;border-radius:14px;background:#3a2f9e;color:#fff;font-size:clamp(18px,3vw,38px);padding:.3em .6em;cursor:pointer}
#field{position:relative;overflow:hidden;background:
 radial-gradient(1.5px 1.5px at 20% 15%,#fff8 50%,transparent),radial-gradient(1.5px 1.5px at 70% 30%,#fff8 50%,transparent),radial-gradient(2px 2px at 45% 8%,#fff9 50%,transparent),radial-gradient(1.5px 1.5px at 88% 12%,#fff8 50%,transparent),
 repeating-linear-gradient(180deg,#2a8f6a 0 25%,#238059 25% 50%);background-blend-mode:normal}
#field:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0d0a2a99,transparent 40%,#0d0a2a55)}
#wall{position:absolute;left:0;top:0;bottom:0;width:15%;background:repeating-linear-gradient(0deg,#8a8fb8 0 14px,#767ba3 14px 16px),#8a8fb8;border-right:6px solid #ff4d6d;box-shadow:6px 0 22px #ff4d6d88}
#castle{position:absolute;left:0;top:50%;width:15%;text-align:center;font-size:min(16vh,10vw);transform:translateY(-50%);filter:drop-shadow(0 6px 0 #0006)}
#castle.hit{animation:sh .4s}
#flash{position:absolute;inset:0;background:#ff1744;opacity:0;pointer-events:none}
#flash.on{animation:fl .45s}
@keyframes fl{from{opacity:.55}to{opacity:0}}
@keyframes sh{20%{transform:translateY(-50%) translateX(-10px) rotate(-4deg)}60%{transform:translateY(-50%) translateX(10px) rotate(4deg)}}
