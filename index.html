stop(){if(!this.run)return;this.run=false;clearInterval(this.tm);const g=this.g;try{g.gain.setTargetAtTime(0,ac.currentTime,.15);setTimeout(()=>{try{g.disconnect()}catch(e){}},900)}catch(e){}},
sched(){const sp=60/Math.min(124,94+(st?st.level:1)*3)/2;while(this.t<ac.currentTime+.35){this.step(this.n++,this.t,sp);this.t+=sp}},
o(f,t,d,v,ty){const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(this.g);o.start(t);o.stop(t+d+.05)},
hat(t){const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=this.nb;f.type="highpass";f.frequency.value=6500;g.gain.value=.012;s.connect(f);f.connect(g);g.connect(this.g);s.start(t)},
step(n,t,sp){const CH=[[57,[0,3,7]],[53,[0,4,7]],[60,[0,4,7]],[55,[0,4,7]]],s=n%8,[r,iv]=CH[(n>>3)%4],f=m=>440*2**((m-69)/12);
 if(s===0)iv.forEach(i=>this.o(f(r+i),t,sp*8,.028,"sine"));
 if(s%4===0)this.o(f(r-12),t,sp*2.5,.1,"sine");
 this.o(f(r+12+iv[[0,1,2,1,0,2,1,2][s]]+(s===5||s===7?12:0)),t,sp*1.6,.05,"triangle");
 if(s%2===1)this.hat(t)}};
function icons(){$("#snd").innerHTML=IC.snd(sound);$("#mus").innerHTML=IC.mus(music.on);$("#pz").innerHTML=IC.pz}
function say(t){if(!sound||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;speechSynthesis.speak(u)}catch(e){}}

/* ---------- oyun ---------- */
const panel=$("#panel");
for(let i=0;i<SLOTS;i++){const b=document.createElement("button");b.className="a";b.style.setProperty("--c",COL[i]);b.addEventListener("pointerdown",e=>{e.preventDefault();answer(i)});panel.appendChild(b);btns.push(b)}
const blank=()=>({hp:3,score:0,combo:0,level:1,kills:0,best:0,enemies:[],slots:Array(SLOTS).fill(null),run:false,left:TURN,locks:new Map(),missed:[]});
function freeWord(){const used=new Set([...st.slots,...st.enemies.map(e=>e.w.en)]);const p=W.filter(w=>!used.has(w.en));return p[Math.random()*p.length|0].en}
function setSlot(i,en){st.slots[i]=en;st.locks.delete(i);const b=btns[i];b.classList.remove("pop","no","lk");b.textContent=capE(en);void b.offsetWidth;b.classList.add("pop")}
function lockSlot(i){st.locks.set(i,performance.now()+6000);btns[i].classList.add("lk")}
function unlockAll(){st.locks.clear();btns.forEach(b=>b.classList.remove("lk"))}
function hud(){$("#hp").innerHTML=[0,1,2].map(i=>SV.heart(i<st.hp)).join("");$("#sc").textContent=st.score;$("#hi").textContent=Math.max(hi,st.score);$("#lv").textContent=st.level;$("#cb").innerHTML=st.combo>1?`<span class="pill">KOMBO x${Math.min(st.combo,6)}</span><i class="cbar"><b></b></i>`:"";$("#who").textContent=PL[pi]?PL[pi].n:"";tmr()}
function tmr(){const s=Math.ceil(st.left);$("#tm").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");$("#tbar i").style.width=st.left/TURN*100+"%"}
function newGame(){PL=Array.from({length:npl},(_,i)=>({n:(names[i]||"").trim()||(npl>1?"Oyuncu "+(i+1):"Oyuncu"),s:0,kills:0,best:0,missed:[]}));pi=0;startTurn()}
function startTurn(){
 document.querySelectorAll(".enemy,.bolt,.fl,.bn").forEach(e=>e.remove());
 st=blank();st.run=true;st.spawnT=.6;st.last=performance.now();unlockAll();
 for(let i=0;i<SLOTS;i++)setSlot(i,freeWord());
 hud();$("#screen").hidden=true;music.start();requestAnimationFrame(loop)}
const speed=()=>Math.min(.13,.05+.007*st.level),interval=()=>Math.max(1.1,2.6-.15*st.level),maxAct=()=>Math.min(6,3+(st.level>>1));
function spawn(){
 const lanes=[...Array(LANES).keys()].filter(l=>!st.enemies.some(e=>e.lane===l&&e.x>.72));
 if(!lanes.length)return false;
 const act=new Set(st.enemies.map(e=>e.w.en)),p=W.filter(w=>!act.has(w.en)),w=p[Math.random()*p.length|0];
 if(!st.slots.includes(w.en)){const free=st.slots.map((_,i)=>i).filter(i=>!act.has(st.slots[i]));setSlot(free[Math.random()*free.length|0],w.en)}
 const lane=lanes[Math.random()*lanes.length|0],el=document.createElement("div");
 el.className="enemy";el.style.top=lane*25+"%";
 el.innerHTML=`<div class="mon">${MONS[Math.random()*MONS.length|0](MC[Math.random()*MC.length|0])}</div><div class="tag">${esc(capT(w.tr))}</div>`;
 $("#field").appendChild(el);
 const e={w,lane,el,x:1.02,k:.85+Math.random()*.3,dead:false};el.style.left=e.x*100+"%";st.enemies.push(e);return true}
function loop(t){
 if(!st||!st.run)return;
 const dt=Math.min(.05,(t-st.last)/1000);st.last=t;
 st.left-=dt;if(st.left<=0){st.left=0;tmr();endTurn("Süre doldu!");return}
 tmr();const now=performance.now();if(st.combo>0){const r=1-(now-st.cbAt)/CB;if(r<=0){st.combo=0;hud()}else{const cb=document.querySelector(".cbar b");if(cb)cb.style.width=r*100+"%"}}st.locks.forEach((u,i)=>{if(now>u){st.locks.delete(i);btns[i].classList.remove("lk")}});
 st.spawnT-=dt;
 if(st.spawnT<=0){st.spawnT=(st.enemies.filter(e=>!e.dead).length<maxAct()&&spawn())?interval():.4}
 for(const e of [...st.enemies]){if(e.dead)continue;e.x-=speed()*dt*e.k;e.el.style.left=e.x*100+"%";if(e.x<=CX-.02){reach(e);if(!st.run)return}}
 requestAnimationFrame(loop)}
function drop(e){e.el.remove();st.enemies=st.enemies.filter(x=>x!==e);const i=st.slots.indexOf(e.w.en);if(i>-1)setSlot(i,freeWord())}
function reach(e){
 if(!st.missed.some(m=>m.en===e.w.en))st.missed.push(e.w);
 drop(e);st.hp--;st.combo=0;sfx.hit();
 const c=$("#castle");c.classList.remove("hit");void c.offsetWidth;c.classList.add("hit");
 const f=$("#flash");f.classList.remove("on");void f.offsetWidth;f.classList.add("on");
 hud();if(st.hp<=0)endTurn("Kale düştü!")}
function answer(i){
 if(!st||!st.run||st.locks.has(i))return;
 const en=st.slots[i],c=st.enemies.filter(e=>!e.dead&&e.w.en===en);
 if(!c.length){st.combo=0;sfx.no();lockSlot(i);hud();return}
 const e=c.sort((a,b)=>a.x-b.x)[0];e.dead=true;st.combo++;st.cbAt=performance.now();st.best=Math.max(st.best,st.combo);
 const gain=10*Math.min(st.combo,6);st.score+=gain;unlockAll();say(en);sfx.ok();fire(e,gain);hud()}
function fire(e,gain){
 const f=$("#field"),fr=f.getBoundingClientRect(),cr=$("#castle").getBoundingClientRect(),er=e.el.getBoundingClientRect();
 const b=document.createElement("div");b.className="bolt";b.innerHTML=SV.bolt;f.appendChild(b);const h=b.offsetWidth/2;
 const x0=cr.left-fr.left+cr.width*.75-h,y0=cr.top-fr.top+cr.height*.3-h,x1=er.left-fr.left+er.width/2-h,y1=er.top-fr.top+er.height/2-h;
 b.animate([{transform:`translate(${x0}px,${y0}px) scale(.8)`},{transform:`translate(${x1}px,${y1}px) scale(1.3)`}],{duration:280,easing:"ease-in",fill:"forwards"}).onfinish=()=>{
  b.remove();const m=e.el.querySelector(".mon");m.innerHTML=SV.burst;m.style.animation="none";
  const t=document.createElement("div");t.className="fl";t.textContent="+"+gain;t.style.left=x1+"px";t.style.top=y1+"px";f.appendChild(t);
  t.animate([{transform:"translateY(0)",opacity:1},{transform:"translateY(-60px)",opacity:0}],{duration:700}).onfinish=()=>t.remove();
  setTimeout(()=>{if(!st)return;drop(e);st.kills++;const lv=1+Math.floor(st.kills/8);if(lv>st.level){st.level=lv;banner("SEVİYE "+lv)}hud()},200)}}
function banner(t){const b=document.createElement("div");b.className="bn";b.textContent=t;$("#field").appendChild(b);setTimeout(()=>b.remove(),1700)}

/* ---------- tur ve sıralama ---------- */
function show(h){$("#box").innerHTML=h;$("#screen").hidden=false}
function endTurn(w){
 if(!st.run)return;st.run=false;music.stop();why=w;
 const P=PL[pi];Object.assign(P,{s:st.score,kills:st.kills,best:st.best,missed:st.missed});
 if(st.score>hi){hi=st.score;ls.set("wc_hi",hi);P.rec=true}
 const nx=PL[pi+1];
 if(nx){show(`<h1 class="sm">${w}</h1><p>${esc(P.n)}: <b>${P.s}</b> puan</p><p>Sıradaki oyuncu: <b>${esc(nx.n)}</b></p><button class="go" id="nx">Hazırım</button>`);$("#nx").onclick=()=>{pi++;startTurn()}}
 else final()}
function final(){
 const R=[...PL].sort((a,b)=>b.s-a.s),ms=[...new Map(PL.flatMap(p=>p.missed).map(w=>[w.en,w])).values()];
 let h;
 if(PL.length==1){const P=PL[0];h=`<h1 class="sm">${why}</h1><div class="stats"><div><small>PUAN</small>${P.s}</div><div><small>REKOR</small>${hi}${P.rec?" (yeni)":""}</div><div><small>YOK EDİLEN</small>${P.kills}</div><div><small>EN İYİ KOMBO</small>x${P.best}</div></div>`}
 else{h=`<h1 class="sm">${R[0].s===R[1].s?"Berabere!":"Kazanan: "+esc(R[0].n)}</h1><div class="rank">${R.map((p,i)=>`<div class="rk"><span class="md m${i+1}">${i+1}</span><b>${esc(p.n)}</b><em>${p.kills} düşman · x${p.best}</em><strong>${p.s}</strong></div>`).join("")}</div>`}
 if(ms.length)h+=`<div class="miss">Tekrar et: ${ms.slice(0,8).map(w=>`<b>${esc(capE(w.en))}</b> = ${esc(capT(w.tr))}`).join(" · ")}</div>`;
 h+=`<button class="go" id="again">Yeniden Başla</button> <button class="go alt" id="chg">Ünite Değiştir</button>`;
 show(h);$("#again").onclick=newGame;$("#chg").onclick=()=>units(grade)}
function pause(){
 if(!st||!st.run)return;st.run=false;music.stop();
 show(`<h1 class="sm">Duraklatıldı</h1><button class="go" id="res">Devam Et</button> <button class="go alt" id="mn">Üniteler</button>`);
 $("#res").onclick=()=>{$("#screen").hidden=true;st.run=true;st.last=performance.now();music.start();requestAnimationFrame(loop)};
 $("#mn").onclick=()=>units(grade)}
$("#pz").onclick=pause;
$("#snd").onclick=()=>{sound=!sound;icons()};
$("#mus").onclick=()=>{music.on=!music.on;icons();if(!music.on)music.stop();else if(st&&st.run)music.start()};
$("#cheat").onclick=()=>{const t=$("#toast");t.textContent="küçük bir şakaydı";t.classList.remove("on");void t.offsetWidth;t.classList.add("on")};
document.addEventListener("visibilitychange",()=>{if(document.hidden)pause()});

/* ---------- menüler ---------- */
function home(){
 st=blank();PL=[];pi=0;hud();
 show(`<h1>Word Castle</h1><p>Sınıfını seç</p><div class="grs">${[5,6,7,8].map(g=>`<button class="gr" data-g="${g}" style="--c:${COL[g-4]}">${g}. Sınıf</button>`).join("")}</div><div class="cr">Mehmet Tarman Ortaokulu · İngilizce</div>`);
 document.querySelectorAll(".gr").forEach(b=>b.onclick=()=>units(+b.dataset.g))}
function pnames(){const el=$("#pn");el.innerHTML=Array.from({length:npl},(_,i)=>`<input maxlength="12" placeholder="${npl>1?"Oyuncu "+(i+1):"Adın"}" value="${esc(names[i]||"")}">`).join("");el.querySelectorAll("input").forEach((x,i)=>x.oninput=()=>names[i]=x.value)}
function units(g){
 grade=g;sel=new Set();const ks=Object.keys(D[g]);
 show(`<h1 class="sm">${g}. Sınıf</h1><p>Ünite seç (birden fazla seçebilirsin)</p><div class="us">${ks.map((k,i)=>`<button class="u" data-i="${i}">${k}</button>`).join("")}</div><div class="h3">Kim oynuyor? <span>(sırayla, her oyuncuya 2 dk)</span></div><div class="sg" id="npl">${[1,2,3,4].map(n=>`<button data-n="${n}" class="${n==npl?"on":""}">${n==1?"Tek":n+" kişi"}</button>`).join("")}</div><div id="pn"></div><div class="row"><button class="go alt" id="back">Geri</button><button class="go alt" id="all">Tümünü Seç</button><button class="go" id="start">BAŞLA</button></div>`);
 const bs=[...document.querySelectorAll(".u")];
 bs.forEach(b=>b.onclick=()=>{const k=ks[+b.dataset.i];sel.has(k)?sel.delete(k):sel.add(k);b.classList.toggle("on",sel.has(k))});
 $("#all").onclick=()=>{const all=sel.size<ks.length;sel=new Set(all?ks:[]);bs.forEach(b=>b.classList.toggle("on",all))};
 $("#npl").onclick=e=>{const b=e.target.closest("button");if(!b)return;npl=+b.dataset.n;[...$("#npl").children].forEach(x=>x.classList.toggle("on",x===b));pnames()};
 pnames();$("#back").onclick=home;
 $("#start").onclick=()=>{if(!sel.size){alert("En az bir ünite seç.");return}build();newGame()}}
function build(){
 const sE=new Set(),sT=new Set();W=[];
 sel.forEach(k=>D[grade][k].split(",").forEach(p=>{const[t,e]=p.split("=");if(sE.has(e)||sT.has(t))return;sE.add(e);sT.add(t);W.push({tr:t,en:e})}))}
(function(){
 const pal=["#4285f4","#9b72cb","#d96570","#ffd60a","#fff"],isp=$("#isp");
 for(let i=0;i<60;i++){const p=document.createElement("span");p.className="p";p.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;--s:${1+Math.random()*3}px;--d:${2+Math.random()*3}s;--l:${Math.random()*3}s;background:${pal[i%5]}`;isp.appendChild(p)}
 const sp=(el,t,d0,step)=>{el.innerHTML=[...t].map((c,i)=>`<span style="animation-delay:${d0+i*step}s,${-i*.12}s">${c===" "?"&nbsp;":c}</span>`).join("")};
 sp($("#sch"),"MEHMET TARMAN ORTAOKULU",1.1,.05);
 sp($("#wc"),"WORD CASTLE",2.3,.09);
 let ready=false;setTimeout(()=>ready=true,4000);
 $("#intro").addEventListener("click",()=>{if(!ready)return;ready=false;sfx.intro();const n=$("#intro");n.classList.add("out");setTimeout(()=>n.remove(),900)})
})();
icons();home();
</script>
</body>
</html>
